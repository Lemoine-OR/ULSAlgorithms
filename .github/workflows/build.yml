name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Version, build, test and validate packages
    runs-on: windows-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build, test and validate
        shell: pwsh
        run: |
          ./build/Build-Validated.ps1

      - name: Collect coverage report (no percentage threshold)
        shell: pwsh
        run: |
          dotnet test tests/ULSAlgorithms.Tests/ULSAlgorithms.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory Documentation/coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ULSAlgorithms-Coverage
          path: Documentation/coverage
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ULSAlgorithms-TestResults
          path: Documentation/test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload validated packages
        uses: actions/upload-artifact@v7
        with:
          name: ULSAlgorithms-validated
          path: |
            Documentation/artifacts/validated
            Documentation/artifacts/nuget
            Documentation/artifacts/*.zip
            Documentation/artifacts/*.sha256
            Documentation/artifacts/*.json
          if-no-files-found: error
          retention-days: 30

  linux-validation:
    name: Linux full build, test and portability smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build every .NET project and run all tests
        shell: pwsh
        run: |
          ./build/Build-All.ps1

      - name: Run portable adaptive exact smoke
        shell: pwsh
        run: |
          dotnet run --configuration Release --no-build --project tools/ULSAlgorithms.PortabilitySmoke/ULSAlgorithms.PortabilitySmoke.csproj

  cbc-integration:
    name: Linux CBC end-to-end solver qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install COIN-OR CBC
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-cbc
          CBC_PATH="$(command -v cbc)"
          test -n "$CBC_PATH"
          echo "ULSALGORITHMS_CBC_EXECUTABLE=$CBC_PATH" >> "$GITHUB_ENV"
          "$CBC_PATH" -quit

      - name: Run six-strategy CBC qualification
        shell: pwsh
        run: |
          dotnet run --configuration Release --project tools/ULSAlgorithms.CbcIntegrationSmoke/ULSAlgorithms.CbcIntegrationSmoke.csproj
