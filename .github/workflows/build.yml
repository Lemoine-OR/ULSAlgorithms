name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Version, build, test and validate binaries
    runs-on: windows-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build, test and validate
        shell: pwsh
        run: |
          ./build/Build-Validated.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ULSAlgorithms-TestResults
          path: Documentation/test-results
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload validated binaries
        uses: actions/upload-artifact@v7
        with:
          name: ULSAlgorithms-validated
          path: |
            Documentation/artifacts/validated
            Documentation/artifacts/*.zip
            Documentation/artifacts/*.sha256
            Documentation/artifacts/*.json
          if-no-files-found: ignore
          retention-days: 30
